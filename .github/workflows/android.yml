name: Android

on:
  push:
    paths:
      - 'apps/tablet-android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/tablet-android/**'
      - '.github/workflows/android.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        standalone: ['false', 'true']
    defaults:
      run:
        working-directory: apps/tablet-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Download and verify Spotify App Remote SDK
        shell: pwsh
        run: ./scripts/setup-spotify.ps1
      - run: chmod +x gradlew
      - run: ./gradlew -Pstandalone=${{ matrix.standalone }} assembleDebug testDebugUnitTest lintDebug
